name: Build RVSDesk Portable (Zero-Cost CI/CD)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ====================================================================
  # JOB 1: Menjana Fail FFI Bridge Antara Rust & Flutter (Linux Runner)
  # Diperlukan secara rasmi oleh Flutter-Rust-Bridge untuk RustDesk
  # ====================================================================
  generate-bridge:
    name: Generate Flutter-Rust Bridge
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          components: "rustfmt"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          cache: true

      - name: Install Bridge Generator & Generate Files
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload Bridge Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h

  # ====================================================================
  # JOB 2: Kompilasi Windows Single Portable .exe (RVSDesk)
  # ====================================================================
  build-windows:
    name: Build RVSDesk Windows Single .exe
    needs: [generate-bridge]
    runs-on: windows-2022

    steps:
      - name: Checkout RVSDesk Configuration & Branding Repo
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LLVM and Clang (15.0.2 For Rust-Bindgen)
        run: |
          choco install llvm -y --version 15.0.2 --allow-downgrade --force
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          cache: true

      - name: Enable Flutter Windows Desktop
        run: |
          flutter config --enable-windows-desktop

      - name: Clone RustDesk Engine with Submodules
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 https://github.com/rustdesk/rustdesk.git engine

      - name: Restore Generated Bridge Files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: engine

      - name: Cache vcpkg Installed Packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-installed-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-

      - name: Setup vcpkg and Dependencies
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          cd $vcpkgRoot
          .\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Install Python Portable Packer Dependencies
        shell: powershell
        run: |
          pip install -r engine/libs/portable/requirements.txt

      - name: Apply RVSDesk Branding, Logo & Strip UAC Warning
        run: |
          python scripts/apply_branding.py engine

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Compile and Build Windows Portable Executable
        shell: powershell
        run: |
          cd engine
          # 1. Kompilasi enjin teras dan bina bundle Flutter (tanpa --hwcodec agar tidak memerlukan header C++ FFmpeg yang hilang)
          python build.py --portable --flutter --skip-portable-pack
          
          # 2. Salin output build Flutter ke direktori release dan namakan rvsdesk.exe
          if (Test-Path "flutter/build/windows/x64/runner/Release") {
            Copy-Item -Path "flutter/build/windows/x64/runner/Release" -Destination "..\rustdesk_bundle" -Recurse -Force
            if (Test-Path "..\rustdesk_bundle\rustdesk.exe") {
              Move-Item -Path "..\rustdesk_bundle\rustdesk.exe" -Destination "..\rustdesk_bundle\rvsdesk.exe" -Force
            }
          } else {
            Write-Error "Flutter Windows release bundle was not found!"
          }
          
          # 3. Jana fail tunggal portable .exe menggunakan alat pemaket rasmi (menyasarkan rvsdesk.exe)
          cd libs/portable
          python generate.py -f ../../../rustdesk_bundle -o . -e ../../../rustdesk_bundle/rvsdesk.exe
          cd ../..
          
          # 4. Cari binary tunggal mudah alih yang telah siap dipaketkan
          $singleExe = Get-ChildItem -Path target/release -Filter "*portable*.exe" | Select-Object -First 1
          if (-not $singleExe) {
            $singleExe = Get-ChildItem -Path . -Filter "*install*.exe" -Recurse | Select-Object -First 1
          }
          if ($singleExe) {
            Copy-Item $singleExe.FullName -Destination "..\RVSDesk-Portable.exe" -Force
            Write-Host "Berjaya menjana: RVSDesk-Portable.exe ($($singleExe.Length) bytes)"
          } else {
            Write-Error "Single portable binary was not found!"
          }

      - name: Digital Signature (Zero Cost Self-Signed Authenticode)
        shell: powershell
        run: |
          if (Test-Path "RVSDesk-Portable.exe") {
            powershell -ExecutionPolicy Bypass -File scripts/create_self_signed_cert.ps1 -TargetExe "RVSDesk-Portable.exe"
          }

      - name: Upload RVSDesk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVSDesk-Windows-Portable-x64
          path: RVSDesk-Portable.exe
          if-no-files-found: error

      - name: Create GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RVSDesk-Portable.exe
          name: RVSDesk ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build RVSDesk Portable (Zero-Cost CI/CD)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build RVSDesk Windows Single .exe
    runs-on: windows-2022

    steps:
      - name: Checkout RVSDesk Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LLVM and Clang (15.0.2 For Rust-Bindgen)
        run: |
          choco install llvm -y --version 15.0.2 --allow-downgrade --force
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Windows Desktop
        run: |
          flutter config --enable-windows-desktop

      - name: Clone RustDesk Engine Baseline with Submodules
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 https://github.com/rustdesk/rustdesk.git engine

      - name: Cache vcpkg Installed Packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-installed-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-

      - name: Setup vcpkg and Dependencies
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          cd $vcpkgRoot
          .\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Install Portable Packaging Python Requirements
        shell: powershell
        run: |
          if (Test-Path "engine\libs\portable\requirements.txt") {
            pip install -r engine\libs\portable\requirements.txt
          }

      - name: Apply RVSDesk Branding, Logo & Strip UAC Warning
        run: |
          python scripts/apply_branding.py engine

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build RVSDesk Portable Single Executable
        shell: powershell
        run: |
          cd engine
          # Jalankan skrip pembina rasmi untuk menjana portable executable
          if (Test-Path "build.py") {
            python build.py --portable --flutter --hwcodec
          } else {
            cargo build --release
          }
          
          # Cari executable portable yang telah siap dipaketkan
          $exe = Get-ChildItem -Path . -Filter "*.exe" -Recurse | Where-Object { 
            $_.FullName -notlike "*target\release\build*" -and 
            $_.FullName -notlike "*\deps\*" -and 
            $_.Length -gt 15MB 
          } | Sort-Object Length -Descending | Select-Object -First 1

          if ($exe) {
            Copy-Item $exe.FullName -Destination "..\RVSDesk-Portable.exe" -Force
            Write-Host "Successfully generated RVSDesk-Portable.exe ($($exe.Length) bytes)"
          } else {
            Write-Error "Portable binary was not found after build!"
          }

      - name: Digital Signature (Zero Cost Self-Signed Authenticode)
        shell: powershell
        run: |
          if (Test-Path "RVSDesk-Portable.exe") {
            powershell -ExecutionPolicy Bypass -File scripts/create_self_signed_cert.ps1 -TargetExe "RVSDesk-Portable.exe"
          }

      - name: Upload RVSDesk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVSDesk-Windows-Portable-x64
          path: RVSDesk-Portable.exe
          if-no-files-found: error

      - name: Create GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RVSDesk-Portable.exe
          name: RVSDesk ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

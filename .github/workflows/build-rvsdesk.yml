name: Build RVDesk Portable (Zero-Cost CI/CD)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ====================================================================
  # JOB 1: Menjana Fail FFI Bridge Antara Rust & Flutter (Linux Runner)
  # Diperlukan secara rasmi oleh Flutter-Rust-Bridge untuk RustDesk
  # ====================================================================
  generate-bridge:
    name: Generate Flutter-Rust Bridge
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          components: "rustfmt"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          cache: true

      - name: Install Bridge Generator & Generate Files
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload Bridge Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h

  # ====================================================================
  # JOB 2: Kompilasi Windows Single Portable .exe (RVDesk)
  # ====================================================================
  build-windows:
    name: Build RVDesk Windows Single .exe
    needs: [generate-bridge]
    runs-on: windows-2022

    steps:
      - name: Checkout RVDesk Configuration & Branding Repo
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LLVM and Clang (15.0.2 For Rust-Bindgen)
        run: |
          choco install llvm -y --version 15.0.2 --allow-downgrade --force
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          cache: true

      - name: Enable Flutter Windows Desktop
        run: |
          flutter config --enable-windows-desktop

      - name: Clone RustDesk Engine with Submodules
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 https://github.com/rustdesk/rustdesk.git engine

      - name: Restore Generated Bridge Files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: engine

      - name: Cache vcpkg Installed Packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-installed-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-

      - name: Setup vcpkg and Dependencies
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          cd $vcpkgRoot
          .\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Install Python Portable Packer Dependencies
        shell: powershell
        run: |
          pip install -r engine/libs/portable/requirements.txt

      - name: Apply RVDesk Branding, Logo & Strip UAC Warning
        run: |
          python scripts/apply_branding.py engine

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Compile and Build Windows Portable Executable
        shell: powershell
        run: |
          cd engine
          # 1. Kompilasi enjin teras dan bina bundle Flutter (tanpa --hwcodec agar tidak memerlukan header C++ FFmpeg yang hilang)
          python build.py --portable --flutter --skip-portable-pack
          
          # 2. Salin output build Flutter ke direktori release dan namakan RVDesk.exe
          if (Test-Path "flutter/build/windows/x64/runner/Release") {
            Copy-Item -Path "flutter/build/windows/x64/runner/Release" -Destination "..\rustdesk_bundle" -Recurse -Force
            if (Test-Path "..\rustdesk_bundle\rustdesk.exe") {
              Move-Item -Path "..\rustdesk_bundle\rustdesk.exe" -Destination "..\rustdesk_bundle\RVDesk.exe" -Force
            }
          } else {
            Write-Error "Flutter Windows release bundle was not found!"
          }

      - name: Verify Auth Host in Built Bundle
        shell: powershell
        run: |
          $bundle = Get-ChildItem -Path . -Recurse -Directory -Filter rustdesk_bundle -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bundle) { throw "rustdesk_bundle directory not found" }
          $enc = [Text.Encoding]::GetEncoding(28591)
          $newHits = @(); $oldHits = @(); $scanned = 0
          Get-ChildItem -Path $bundle.FullName -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            $scanned++
            $s = $enc.GetString([IO.File]::ReadAllBytes($_.FullName))
            if ($s -match 'rithvservices\.my\.id') { $newHits += $_.FullName }
            if ($s -match 'service\.danialharith\.space') { $oldHits += $_.FullName }
          }
          Write-Host "scanned $scanned files under $($bundle.FullName)"
          if ($newHits.Count -eq 0) { throw "auth host rithvservices.my.id missing from built bundle" }
          if ($oldHits.Count -gt 0) { throw ("old auth host service.danialharith.space still present in: " + ($oldHits -join ', ')) }
          Write-Host ("PASS: new auth host present in: " + (($newHits | ForEach-Object { $_ }) -join ', '))

      - name: Pack Single-File Portable Executable
        shell: powershell
        run: |
          cd engine
          # 3. Jana fail tunggal portable .exe menggunakan alat pemaket rasmi (menyasarkan RVDesk.exe)
          cd libs/portable
          python generate.py -f ../../../rustdesk_bundle -o . -e RVDesk.exe
          cd ../..
          
          # 4. Cari binary tunggal mudah alih yang telah siap dipaketkan
          $singleExe = Get-ChildItem -Path target/release -Filter "*portable*.exe" | Select-Object -First 1
          if (-not $singleExe) {
            $singleExe = Get-ChildItem -Path . -Filter "*install*.exe" -Recurse | Select-Object -First 1
          }
          if ($singleExe) {
            Copy-Item $singleExe.FullName -Destination "..\RVDesk-Portable.exe" -Force
            Write-Host "Berjaya menjana: RVDesk-Portable.exe ($($singleExe.Length) bytes)"
          } else {
            Write-Error "Single portable binary was not found!"
          }

      - name: Stamp Binary Metadata & Sign Portable
        shell: powershell
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (Test-Path "RVDesk-Portable.exe") {
            if (Test-Path "scripts/rcedit-x64.exe") {
              .\scripts\rcedit-x64.exe RVDesk-Portable.exe `
                --set-version-string "FileDescription" "RVDesk Remote Desktop" `
                --set-version-string "ProductName" "RVDesk" `
                --set-version-string "InternalName" "RVDesk" `
                --set-version-string "OriginalFilename" "RVDesk.exe" `
                --set-version-string "CompanyName" "RithV Services" `
                --set-version-string "Comments" "Based on RustDesk by Purslane Tech Pte. Ltd., licensed under AGPL-3.0" `
                --set-version-string "LegalCopyright" "Copyright (c) 2026 Purslane Tech Pte. Ltd. and contributors; RVDesk by RithV Services (AGPL-3.0)" `
                --set-icon assets/rvsdesk.ico
              if ($LASTEXITCODE -ne 0) { throw "rcedit stamp failed ($LASTEXITCODE)" }
              $stampedProduct = (Get-Item "RVDesk-Portable.exe").VersionInfo.ProductName
              if ($stampedProduct -ne "RVDesk") { throw "rcedit verification failed: ProductName is '$stampedProduct', expected 'RVDesk'" }
            } else {
              throw "rcedit not found at scripts/rcedit-x64.exe"
            }
            # Sign with the configured release certificate; never mint a per-run cert.
            if (-not [string]::IsNullOrWhiteSpace($env:PFX_B64) -and -not [string]::IsNullOrWhiteSpace($env:PFX_PASS)) {
              $pfxPath = Join-Path $env:RUNNER_TEMP "rvdesk-release.pfx"
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
              $secPass = ConvertTo-SecureString $env:PFX_PASS -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secPass
              if (-not $cert) { throw "PFX import failed" }
              # Trust this run's imported cert only so verify /pa can pass. Nothing is exported or published.
              try {
                $rootStore = New-Object Security.Cryptography.X509Certificates.X509Store("Root", "CurrentUser")
                $rootStore.Open("ReadWrite")
                $rootStore.Add($cert)
                $rootStore.Close()
              } catch {
                Write-Host "Warning: could not trust signing cert for verify /pa: $_"
              }
              if (Test-Path "assets\RVDesk_Authority.cer") {
                $authorityThumb = (New-Object Security.Cryptography.X509Certificates.X509Certificate2((Resolve-Path "assets\RVDesk_Authority.cer").Path)).Thumbprint
                if ($authorityThumb -ne $cert.Thumbprint) {
                  Write-Host "WARNING: signing cert $($cert.Thumbprint) differs from assets\RVDesk_Authority.cer ($authorityThumb)"
                }
              }
              $signtoolPath = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
              if (-not $signtoolPath) {
                $signtoolPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
              }
              if (-not $signtoolPath) { throw "signtool.exe not found on runner" }
              & $signtoolPath sign /fd SHA256 /sha1 $cert.Thumbprint /tr http://timestamp.digicert.com /td SHA256 /d "RVDesk Remote Desktop" "RVDesk-Portable.exe"
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
              & $signtoolPath verify /pa "RVDesk-Portable.exe"
              if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed ($LASTEXITCODE)" }
              Write-Host "RVDesk-Portable.exe signed ($($cert.Thumbprint)) and verified"
            } else {
              Write-Host "portable unsigned (no signing secrets)"
            }

            # Bina pakej .zip bersama Smart Launcher Anti-SmartScreen & 1-Click Trusted Setup
            New-Item -ItemType Directory -Path "pkg" -Force | Out-Null
            Copy-Item "RVDesk-Portable.exe" -Destination "pkg\RVDesk.exe"
            Copy-Item "assets\RVDesk-Launcher.bat" -Destination "pkg\RVDesk-Launcher.bat"
            if (Test-Path "assets\RVDesk-Downloader.bat") { Copy-Item "assets\RVDesk-Downloader.bat" -Destination "pkg\RVDesk-Downloader.bat" }
            if (Test-Path "assets\Setup_Trust_RVDesk.bat") { Copy-Item "assets\Setup_Trust_RVDesk.bat" -Destination "pkg\Setup_Trust_RVDesk.bat" }
            if (Test-Path "assets\RVDesk_Authority.cer") { Copy-Item "assets\RVDesk_Authority.cer" -Destination "pkg\RVDesk_Authority.cer" }
            Compress-Archive -Path "pkg\*" -DestinationPath "RVDesk-Portable.zip" -Force
          }

      - name: Upload RVDesk Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RVDesk-Windows-Portable-x64
          path: |
            RVDesk-Portable.exe
            RVDesk-Portable.zip
            assets/Setup_Trust_RVDesk.bat
            assets/RVDesk-Launcher.bat
            assets/RVDesk-Downloader.bat
            assets/RVDesk_Authority.cer
          if-no-files-found: error

      - name: Publish to GitHub Release (Tag & Latest Rolling Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RVDesk {0}', github.ref_name) || 'RVDesk Latest Build' }}
          files: |
            RVDesk-Portable.exe
            RVDesk-Portable.zip
            assets/Setup_Trust_RVDesk.bat
            assets/RVDesk-Launcher.bat
            assets/RVDesk-Downloader.bat
            assets/RVDesk_Authority.cer
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

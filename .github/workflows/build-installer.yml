name: Build RVSDesk Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version x.y.z (empty = use installer/VERSION)
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve version into installer\VERSION
        if: inputs.version != "" || github.event_name == "push"
        shell: powershell
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}" }
          $v = $v.Trim() -replace "^v", ""
          Set-Content -Path "installer\VERSION" -Value $v -NoNewline -Encoding ascii
          Write-Host "VERSION -> $v"
      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
      - name: Build installer (unsigned CI build)
        shell: powershell
        run: |
          # Signing happens on the maintainer machine, or later via certificate secrets added to CI.
          powershell -ExecutionPolicy Bypass -File installer\build_installer.ps1 -SkipPayloadSigning -SkipSetupSigning
      - name: Read built version
        id: read-version
        shell: powershell
        run: |
          $v = (Get-Content -Raw "installer\VERSION").Trim()
          Write-Host "version=$v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVSDesk-Setup-${{ steps.read-version.outputs.version }}
          path: installer/Output/*.exe